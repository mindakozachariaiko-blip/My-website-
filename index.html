        // Switch Tab Routing Engine
        function switchTab(tabKey) {
            const formattedTitles = {
                'quizzes': 'Interactive Quizzes', 'past-papers': 'GCE Past Papers', 'mock-papers': 'Regional Mock Papers',
                'concours': 'Concours Prep (ENSP, CUSS...)', 'video-lessons': 'Video Lessons', 'library': 'Digital Library / Textbooks',
                'competitions': 'Online Friend Competitions', 'buy-papers': 'Buy Premium Papers', 'contact': 'Contact Information',
                'settings': 'Settings & Admin panel', 'about-me': 'Founder Bio / About Me'
            };
            document.getElementById('current-portal-title').innerText = formattedTitles[tabKey] || 'mzi\'s sTudy Universe';
            document.getElementById('main-content').innerHTML = contents[tabKey];

            // Highlight chosen sidebar button
            const buttons = document.querySelectorAll('#sidebar-nav button');
            buttons.forEach(btn => {
                if(btn.getAttribute('onclick').includes(`'${tabKey}'`)) {
                    btn.className = "nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-indigo-800 text-white font-medium text-left";
                    let icon = btn.querySelector('i');
                    if(icon) { icon.className = icon.className.replace('text-indigo-400', 'text-amber-400'); }
                } else {
                    btn.className = "nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-indigo-800/50 text-indigo-100 text-left";
                    let icon = btn.querySelector('i');
                    if(icon) { icon.className = icon.className.replace('text-amber-400', 'text-indigo-400'); }
                }
            });

            // Sync values
            if(tabKey === 'buy-papers') { updatePriceDisplay(); }
            if(tabKey === 'settings') { document.getElementById('new-price-input').value = premiumPaperPrice; }

            // Auto close menu drawer on mobile when clicking any option button
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.add('hidden');
                document.getElementById('menu-icon').className = "fa-solid fa-bars";
            }
        }

        // Toggle mobile slide out menu drawer 
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.getElementById('menu-icon');
            if(sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                menuIcon.className = "fa-solid fa-xmark";
            } else {
                sidebar.classList.add('hidden');
                menuIcon.className = "fa-solid fa-bars";
            }
        }

        function filterSubject(subjectName) {
            alert(`Filtering for: "${subjectName}". You can insert your code logic array sorting hooks here.`);
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({
                    title: "mzi's sTudy Universe",
                    text: 'Check out this platform for Cameroon GCE, Mocks, and Concours preparation!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Link copied! Share it with your students via WhatsApp group!");
            }
        }

        function updatePrice() {
            const inputVal = document.getElementById('new-price-input').value;
            if(inputVal && !isNaN(inputVal)) {
                premiumPaperPrice = parseInt(inputVal);
                alert(`Global price updated to: FCFA ${premiumPaperPrice.toLocaleString()}`);
            }
        }

        function updatePriceDisplay() {
            const element = document.getElementById('paper-price-display');
            if(element) { element.innerText = `FCFA ${premiumPaperPrice.toLocaleString()}`; }
        }

        window.onload = function() {
            switchTab('quizzes');
        };
    </script>
